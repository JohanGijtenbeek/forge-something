<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
const COL = { rm: 110, comp: 390, asm: 730, prod: 1010 };
const NODE_W = { rm: 175, comp: 200, asm: 195, prod: 215 };
const NODE_H = { rm: 52, comp: 74, asm: 82, prod: 145 };
const ROW_H = { rm: 62, comp: 80, asm: 90 };
const PAD = 18; // group padding top/bottom
const GROUP_GAP = 22;

const COLORS = {
  rm:   { header: '#1d4d2a', body: '#0f2718', stroke: '#2d7a40', text: '#7ee89a' },
  comp: {
    head:    { header: '#1a3d6e', body: '#0d1f3a', stroke: '#2d6aad', text: '#79b8ff' },
    torso:   { header: '#1a3d5e', body: '#0d1e32', stroke: '#2d5e9a', text: '#79b0ff' },
    arms:    { header: '#2d3a1a', body: '#181e0d', stroke: '#5a7a2d', text: '#a8d080' },
    legs:    { header: '#3a1a3a', body: '#1e0d1e', stroke: '#7a2d7a', text: '#d080d0' },
    backpack:{ header: '#1a3a3a', body: '#0d1e1e', stroke: '#2d7a7a', text: '#70c8c8' },
    weapons: { header: '#3a2a1a', body: '#1e160d', stroke: '#8a5a2d', text: '#d0a060' },
  },
  asm: {
    head:    { header: '#2a1a4a', body: '#150d25', stroke: '#5a3a8a', text: '#b090e0' },
    torso:   { header: '#1a3a2a', body: '#0d1e15', stroke: '#2d7a5a', text: '#70d0a0' },
    arms:    { header: '#3a2a1a', body: '#1e150d', stroke: '#7a5a2d', text: '#d0a060' },
    legs:    { header: '#3a1a2a', body: '#1e0d15', stroke: '#7a2d5a', text: '#d06090' },
    backpack:{ header: '#1a2a3a', body: '#0d151e', stroke: '#2d5a7a', text: '#60a0d0' },
    weapons: { header: '#3a1a1a', body: '#1e0d0d', stroke: '#7a2d2d', text: '#d06060' },
  },
  prod: { header: '#5c2800', body: '#2a1200', stroke: '#c06000', text: '#ffb040' },
};

const GROUP_LABELS = {
  head:    { label: 'HEAD',     fill: '#1a3a60', stroke: '#2d6aad' },
  torso:   { label: 'TORSO',   fill: '#1a3a28', stroke: '#2d6a48' },
  arms:    { label: 'ARMS',    fill: '#2d3a1a', stroke: '#5a7a2d' },
  legs:    { label: 'LEGS',    fill: '#3a1a3a', stroke: '#6a2d6a' },
  backpack:{ label: 'BACKPACK',fill: '#1a3a3a', stroke: '#2d6a6a' },
  weapons: { label: 'WEAPONS', fill: '#3a2a1a', stroke: '#7a5a2d' },
};

// ─── NODES ───────────────────────────────────────────────────────────────────
const rawMaterials = [
  { id:'RM001', code:'GND-RM-001', name:'Luna Titanium Alloy Bar ø50×500' },
  { id:'RM002', code:'GND-RM-002', name:'Luna Titanium Alloy Sheet 4×1000×2000' },
  { id:'RM003', code:'GND-RM-003', name:'Gundarium-G Composite Plate 6×500×1000' },
  { id:'RM004', code:'GND-RM-004', name:'Aluminium 7075-T6 Bar ø80×500' },
  { id:'RM005', code:'GND-RM-005', name:'Aluminium 7075-T6 Sheet 3×1000×2000' },
  { id:'RM006', code:'GND-RM-006', name:'Inconel 718 Bar ø60×300' },
  { id:'RM007', code:'GND-RM-007', name:'Bearing Steel 100Cr6 Bar ø40×200' },
  { id:'RM008', code:'GND-RM-008', name:'Optical Polycarbonate Sheet 10×300×400' },
  { id:'RM009', code:'GND-RM-009', name:'S355J2 Steel Plate 8×500×1000' },
  { id:'RM010', code:'GND-RM-010', name:'Stainless Steel 316L Bar ø30×300' },
];

// group, ops, sub (has subcontract op), rms (input RM ids)
const components = [
  // HEAD
  { id:'C001', code:'GND-C001', name:'Helmet Outer Shell',    group:'head',    ops:5, sub:true,  rms:['RM002','RM003'] },
  { id:'C002', code:'GND-C002', name:'Visor Unit',             group:'head',    ops:4, sub:false, rms:['RM008','RM010'] },
  { id:'C003', code:'GND-C003', name:'Vulcan Gun Barrel',      group:'head',    ops:5, sub:false, rms:['RM007'] },
  { id:'C004', code:'GND-C004', name:'Neck Joint',             group:'head',    ops:5, sub:false, rms:['RM001','RM007'] },
  { id:'C005', code:'GND-C005', name:'Sensor Array Housing',   group:'head',    ops:4, sub:true,  rms:['RM010','RM008'] },
  // TORSO
  { id:'C006', code:'GND-C006', name:'Core Fighter Frame',     group:'torso',   ops:6, sub:true,  rms:['RM009','RM003'] },
  { id:'C007', code:'GND-C007', name:'Chest Armor Panel',      group:'torso',   ops:4, sub:true,  rms:['RM003'] },
  { id:'C008', code:'GND-C008', name:'Cockpit Unit',           group:'torso',   ops:4, sub:false, rms:['RM004','RM008'] },
  { id:'C009', code:'GND-C009', name:'Power Reactor Housing',  group:'torso',   ops:5, sub:false, rms:['RM006','RM010'] },
  // ARMS
  { id:'C010', code:'GND-C010', name:'Upper Arm Segment',      group:'arms',    ops:4, sub:true,  rms:['RM005','RM003'] },
  { id:'C011', code:'GND-C011', name:'Forearm Segment',        group:'arms',    ops:3, sub:false, rms:['RM005'] },
  { id:'C012', code:'GND-C012', name:'Hand Unit',              group:'arms',    ops:4, sub:false, rms:['RM004','RM007'] },
  { id:'C013', code:'GND-C013', name:'Shoulder Armor',         group:'arms',    ops:3, sub:true,  rms:['RM003'] },
  { id:'C014', code:'GND-C014', name:'Elbow Joint',            group:'arms',    ops:4, sub:false, rms:['RM007'] },
  { id:'C015', code:'GND-C015', name:'Wrist Joint',            group:'arms',    ops:3, sub:false, rms:['RM001'] },
  // LEGS
  { id:'C016', code:'GND-C016', name:'Upper Leg Segment',      group:'legs',    ops:4, sub:true,  rms:['RM005','RM003'] },
  { id:'C017', code:'GND-C017', name:'Lower Leg Segment',      group:'legs',    ops:3, sub:false, rms:['RM005'] },
  { id:'C018', code:'GND-C018', name:'Foot Unit',              group:'legs',    ops:4, sub:false, rms:['RM004','RM009'] },
  { id:'C019', code:'GND-C019', name:'Knee Joint',             group:'legs',    ops:4, sub:false, rms:['RM007'] },
  { id:'C020', code:'GND-C020', name:'Ankle Joint',            group:'legs',    ops:4, sub:false, rms:['RM001','RM007'] },
  // BACKPACK
  { id:'C021', code:'GND-C021', name:'Thruster Nozzle',        group:'backpack', ops:6, sub:true,  rms:['RM006'] },
  { id:'C022', code:'GND-C022', name:'Fuel Tank',              group:'backpack', ops:4, sub:false, rms:['RM002'] },
  { id:'C023', code:'GND-C023', name:'Vernier Thruster',       group:'backpack', ops:4, sub:false, rms:['RM001'] },
  { id:'C024', code:'GND-C024', name:'Backpack Structural Frame',group:'backpack',ops:5,sub:true,  rms:['RM009','RM004'] },
  // WEAPONS
  { id:'C025', code:'GND-C025', name:'Shield Armor Panel',     group:'weapons', ops:3, sub:true,  rms:['RM003'] },
  { id:'C026', code:'GND-C026', name:'Shield Frame',           group:'weapons', ops:4, sub:false, rms:['RM009'] },
  { id:'C027', code:'GND-C027', name:'Beam Rifle Body',        group:'weapons', ops:5, sub:false, rms:['RM004','RM007'] },
  { id:'C028', code:'GND-C028', name:'Rifle Grip',             group:'weapons', ops:2, sub:false, rms:['RM004'] },
  { id:'C029', code:'GND-C029', name:'Trigger Mechanism',      group:'weapons', ops:3, sub:false, rms:['RM010','RM007'] },
  { id:'C030', code:'GND-C030', name:'Beam Saber Handle',      group:'weapons', ops:5, sub:true,  rms:['RM001'] },
  { id:'C031', code:'GND-C031', name:'Saber Emitter',          group:'weapons', ops:4, sub:true,  rms:['RM006'] },
];

const assemblies = [
  { id:'A001', code:'GND-A001', name:'Head Assembly',          group:'head',    ops:4, sub:false, comps:['C001','C002','C003','C004','C005'], qty:'' },
  { id:'A002', code:'GND-A002', name:'Torso Assembly',         group:'torso',   ops:4, sub:false, comps:['C006','C007','C008','C009'], qty:'' },
  { id:'A003', code:'GND-A003', name:'Right Arm Assembly',     group:'arms',    ops:3, sub:false, comps:['C010','C011','C012','C013','C014','C015'], qty:'' },
  { id:'A004', code:'GND-A004', name:'Left Arm Assembly',      group:'arms',    ops:3, sub:false, comps:['C010','C011','C012','C013','C014','C015'], qty:'mirror' },
  { id:'A005', code:'GND-A005', name:'Right Leg Assembly',     group:'legs',    ops:3, sub:false, comps:['C016','C017','C018','C019','C020'], qty:'' },
  { id:'A006', code:'GND-A006', name:'Left Leg Assembly',      group:'legs',    ops:3, sub:false, comps:['C016','C017','C018','C019','C020'], qty:'mirror' },
  { id:'A007', code:'GND-A007', name:'Backpack Unit',          group:'backpack', ops:4, sub:false, comps:['C021','C022','C023','C024'], qty:'' },
  { id:'A008', code:'GND-A008', name:'Shield',                 group:'weapons', ops:3, sub:false, comps:['C025','C026'], qty:'' },
  { id:'A009', code:'GND-A009', name:'Beam Rifle',             group:'weapons', ops:3, sub:true,  comps:['C027','C028','C029'], qty:'' },
  { id:'A010', code:'GND-A010', name:'Beam Saber',             group:'weapons', ops:2, sub:false, comps:['C030','C031'], qty:'×2' },
];

const product = { id:'PROD', code:'GND-0001', name:'RX-78-2 Gundam', ops:6, sub:true };

// ─── LAYOUT ENGINE ───────────────────────────────────────────────────────────
const groups = ['head','torso','arms','legs','backpack','weapons'];

// Figure out which RM nodes each group uses
const groupRM = {};
groups.forEach(g => { groupRM[g] = new Set(); });
components.forEach(c => { c.rms.forEach(r => groupRM[c.group].add(r)); });

// Assign Y positions per group
const groupLayouts = {};
let currentY = 60;

groups.forEach(g => {
  const compsInGroup = components.filter(c => c.group === g);
  const asmsInGroup  = assemblies.filter(a => a.group === g);
  const rmsInGroup   = [...groupRM[g]];

  const compRows = compsInGroup.length;
  const rmRows   = rmsInGroup.length;
  const asmRows  = asmsInGroup.length;

  const compHeight = compRows * ROW_H.comp;
  const rmHeight   = rmRows   * ROW_H.rm;
  const asmHeight  = asmRows  * ROW_H.asm;
  const innerH     = Math.max(compHeight, rmHeight, asmHeight);
  const groupH     = innerH + PAD * 2;

  groupLayouts[g] = {
    y: currentY,
    h: groupH,
    comps: compsInGroup,
    asms:  asmsInGroup,
    rms:   rmsInGroup,
    innerH,
  };
  currentY += groupH + GROUP_GAP;
});

const totalH = currentY + 80;
const prodY  = totalH / 2 - NODE_H.prod / 2;
const SVG_W  = 1260;
const SVG_H  = totalH;

// Map node id → {cx, cy} (center point)
const nodePos = {};

groups.forEach(g => {
  const lay = groupLayouts[g];
  const { y, h, comps, asms, rms, innerH } = lay;
  const innerTop = y + PAD;

  // RMs — vertically centred within group
  const rmBlockH = rms.length * ROW_H.rm;
  const rmStartY = innerTop + (innerH - rmBlockH) / 2;
  rms.forEach((rmId, i) => {
    nodePos[rmId] = { cx: COL.rm, cy: rmStartY + i * ROW_H.rm + NODE_H.rm / 2 };
  });

  // Components — vertically centred within group
  const compBlockH = comps.length * ROW_H.comp;
  const compStartY = innerTop + (innerH - compBlockH) / 2;
  comps.forEach((c, i) => {
    nodePos[c.id] = { cx: COL.comp, cy: compStartY + i * ROW_H.comp + NODE_H.comp / 2 };
  });

  // Assemblies — vertically centred within group
  const asmBlockH = asms.length * ROW_H.asm;
  const asmStartY = innerTop + (innerH - asmBlockH) / 2;
  asms.forEach((a, i) => {
    nodePos[a.id] = { cx: COL.asm, cy: asmStartY + i * ROW_H.asm + NODE_H.asm / 2 };
  });
});

nodePos['PROD'] = { cx: COL.prod, cy: prodY + NODE_H.prod / 2 };

// ─── SVG HELPERS ─────────────────────────────────────────────────────────────
function el(tag, attrs={}, ...children) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k, v));
  children.forEach(c => { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}

function bezier(x1, y1, x2, y2, color, opacity=0.55, width=1.5) {
  const mx = (x1 + x2) / 2;
  return el('path', {
    d: `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`,
    fill: 'none', stroke: color, 'stroke-width': width,
    'stroke-opacity': opacity, 'stroke-linecap': 'round'
  });
}

function rmNode(rm, pos) {
  const { cx, cy } = pos;
  const w = NODE_W.rm, h = NODE_H.rm;
  const x = cx - w/2, y = cy - h/2;
  const c = COLORS.rm;
  const g = el('g', { class:'node', transform:`translate(${x},${y})` });

  // drop shadow
  g.appendChild(el('rect', { x:2,y:2, width:w,height:h, rx:5, fill:'#00000060' }));
  // header strip (full height for RM)
  g.appendChild(el('rect', { class:'node-header', width:w, height:h, rx:5, fill:c.header, stroke:c.stroke, 'stroke-width':'1' }));
  // code
  g.appendChild(el('text', { x:8, y:17, 'font-family':'Consolas,monospace', 'font-size':'10', fill:c.text, 'font-weight':'600' }, rm.code));
  // name (truncate to ~28 chars)
  const name = rm.name.length > 30 ? rm.name.slice(0,29)+'…' : rm.name;
  g.appendChild(el('text', { x:8, y:32, 'font-family':'Segoe UI,sans-serif', 'font-size':'9.5', fill:'#8b949e' }, name));
  // output port
  g.appendChild(el('circle', { cx:w, cy:h/2, r:4, fill:c.stroke, stroke:'#0a0a0f', 'stroke-width':'1.5' }));
  return g;
}

function compNode(comp, pos) {
  const { cx, cy } = pos;
  const w = NODE_W.comp, h = NODE_H.comp;
  const x = cx - w/2, y = cy - h/2;
  const c = COLORS.comp[comp.group] || COLORS.comp.head;
  const hh = 22; // header height
  const g = el('g', { class:'node', transform:`translate(${x},${y})` });

  g.appendChild(el('rect', { x:2,y:2, width:w,height:h, rx:5, fill:'#00000060' }));
  g.appendChild(el('rect', { class:'node-body', width:w,height:h, rx:5, fill:c.body, stroke:c.stroke,'stroke-width':'1' }));
  g.appendChild(el('rect', { class:'node-header', width:w,height:hh, rx:5, fill:c.header }));
  g.appendChild(el('rect', { y:hh-4, width:w, height:6, fill:c.header })); // square bottom of header

  g.appendChild(el('text', { x:8, y:15, 'font-family':'Consolas,monospace','font-size':'10',fill:c.text,'font-weight':'600' }, comp.code));
  const name = comp.name.length > 26 ? comp.name.slice(0,25)+'…' : comp.name;
  g.appendChild(el('text', { x:8, y:36, 'font-family':'Segoe UI,sans-serif','font-size':'10',fill:'#c9d1d9' }, name));
  g.appendChild(el('text', { x:8, y:54, 'font-family':'Segoe UI,sans-serif','font-size':'9',fill:'#6e7681' }, `${comp.ops} operations`));
  if (comp.sub) {
    g.appendChild(el('text', { x:w-8, y:54, 'font-family':'Segoe UI,sans-serif','font-size':'9',fill:'#f0a040','text-anchor':'end' }, '⬦ subcontract'));
  }
  // ports
  g.appendChild(el('circle', { cx:0, cy:h/2, r:4, fill:c.stroke, stroke:'#0a0a0f','stroke-width':'1.5' }));
  g.appendChild(el('circle', { cx:w, cy:h/2, r:4, fill:c.stroke, stroke:'#0a0a0f','stroke-width':'1.5' }));
  return g;
}

function asmNode(asm, pos) {
  const { cx, cy } = pos;
  const w = NODE_W.asm, h = NODE_H.asm;
  const x = cx - w/2, y = cy - h/2;
  const c = COLORS.asm[asm.group] || COLORS.asm.head;
  const hh = 24;
  const g = el('g', { class:'node', transform:`translate(${x},${y})` });

  g.appendChild(el('rect', { x:2,y:2,width:w,height:h,rx:5,fill:'#00000060' }));
  g.appendChild(el('rect', { class:'node-body',width:w,height:h,rx:5,fill:c.body,stroke:c.stroke,'stroke-width':'1.5' }));
  g.appendChild(el('rect', { class:'node-header',width:w,height:hh,rx:5,fill:c.header }));
  g.appendChild(el('rect', { y:hh-4,width:w,height:6,fill:c.header }));

  g.appendChild(el('text', { x:9,y:16,'font-family':'Consolas,monospace','font-size':'10.5',fill:c.text,'font-weight':'700' }, asm.code));
  const name = asm.name.length > 24 ? asm.name.slice(0,23)+'…' : asm.name;
  g.appendChild(el('text', { x:9,y:38,'font-family':'Segoe UI,sans-serif','font-size':'10.5',fill:'#e6edf3' }, name));
  g.appendChild(el('text', { x:9,y:55,'font-family':'Segoe UI,sans-serif','font-size':'9',fill:'#6e7681' }, `${asm.comps.length} inputs · ${asm.ops} ops`));
  if (asm.qty === 'mirror') {
    g.appendChild(el('text', { x:9,y:70,'font-family':'Segoe UI,sans-serif','font-size':'9',fill:'#70c8c8' }, '⇌ shared BOM (mirrored)'));
  } else if (asm.qty === '×2') {
    g.appendChild(el('text', { x:9,y:70,'font-family':'Segoe UI,sans-serif','font-size':'9',fill:'#f0a040' }, '× 2 on finished product'));
  }
  if (asm.sub) {
    g.appendChild(el('text', { x:w-8,y:70,'font-family':'Segoe UI,sans-serif','font-size':'9',fill:'#f0a040','text-anchor':'end' }, '⬦ subcontract'));
  }

  g.appendChild(el('circle', { cx:0,cy:h/2,r:5,fill:c.stroke,stroke:'#0a0a0f','stroke-width':'1.5' }));
  g.appendChild(el('circle', { cx:w,cy:h/2,r:5,fill:c.stroke,stroke:'#0a0a0f','stroke-width':'1.5' }));
  return g;
}

function prodNode(pos) {
  const { cx, cy } = pos;
  const w = NODE_W.prod, h = NODE_H.prod;
  const x = cx - w/2, y = cy - h/2;
  const c = COLORS.prod;
  const hh = 30;
  const g = el('g', { class:'node', transform:`translate(${x},${y})` });

  // glow
  g.appendChild(el('rect', { x:-4,y:-4,width:w+8,height:h+8,rx:9,fill:'none',stroke:c.stroke,'stroke-width':'2','stroke-opacity':'0.3' }));
  g.appendChild(el('rect', { x:3,y:3,width:w,height:h,rx:7,fill:'#00000080' }));
  g.appendChild(el('rect', { class:'node-body',width:w,height:h,rx:7,fill:c.body,stroke:c.stroke,'stroke-width':'2' }));
  g.appendChild(el('rect', { class:'node-header',width:w,height:hh,rx:7,fill:c.header }));
  g.appendChild(el('rect', { y:hh-6,width:w,height:8,fill:c.header }));

  g.appendChild(el('text', { x:10,y:20,'font-family':'Consolas,monospace','font-size':'12',fill:c.text,'font-weight':'700' }, product.code));
  g.appendChild(el('text', { x:10,y:52,'font-family':'Segoe UI,sans-serif','font-size':'12',fill:'#e6edf3','font-weight':'600' }, 'RX-78-2 Gundam'));
  g.appendChild(el('text', { x:10,y:72,'font-family':'Segoe UI,sans-serif','font-size':'9.5',fill:'#8b949e' }, '10 assemblies · 6 operations'));
  g.appendChild(el('text', { x:10,y:88,'font-family':'Segoe UI,sans-serif','font-size':'9.5',fill:'#8b949e' }, '52 articles · ~90 BOM lines'));
  g.appendChild(el('text', { x:10,y:104,'font-family':'Segoe UI,sans-serif','font-size':'9.5',fill:'#8b949e' }, '4 levels deep · ~155 total ops'));
  g.appendChild(el('text', { x:10,y:124,'font-family':'Segoe UI,sans-serif','font-size':'9',fill:'#f0a040' }, '⬦ certification & handover (sub)'));

  g.appendChild(el('circle', { cx:0,cy:h/2,r:6,fill:c.stroke,stroke:'#0a0a0f','stroke-width':'2' }));
  return g;
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
const svg = document.getElementById('pipeline');
svg.setAttribute('width', SVG_W);
svg.setAttribute('height', SVG_H);
svg.setAttribute('viewBox', `0 0 ${SVG_W} ${SVG_H}`);

// Background
svg.appendChild(el('rect', { width:SVG_W, height:SVG_H, fill:'#0a0a0f' }));

// Grid
for (let gy = 0; gy < SVG_H; gy += 40) {
  svg.appendChild(el('line', { x1:0,y1:gy,x2:SVG_W,y2:gy,stroke:'#13131a','stroke-width':'1' }));
}
for (let gx = 0; gx < SVG_W; gx += 40) {
  svg.appendChild(el('line', { x1:gx,y1:0,x2:gx,y2:SVG_H,stroke:'#13131a','stroke-width':'1' }));
}

// Column header labels
const colHeaders = [
  { x: COL.rm,   label: 'RAW MATERIALS',   sub: '10 materials' },
  { x: COL.comp, label: 'SUB-COMPONENTS',  sub: '31 parts' },
  { x: COL.asm,  label: 'ASSEMBLIES',      sub: '10 assemblies' },
  { x: COL.prod, label: 'FINISHED PRODUCT',sub: '1 product' },
];
colHeaders.forEach(({ x, label, sub }) => {
  svg.appendChild(el('text', { x, y:22, 'text-anchor':'middle','font-family':'Segoe UI,sans-serif','font-size':'10','font-weight':'700',fill:'#3d444d','letter-spacing':'0.12em' }, label));
  svg.appendChild(el('text', { x, y:36, 'text-anchor':'middle','font-family':'Segoe UI,sans-serif','font-size':'9',fill:'#21262d' }, sub));
  svg.appendChild(el('line', { x1:x,y1:44,x2:x,y2:SVG_H-10,stroke:'#1e1e2e','stroke-width':'1','stroke-dasharray':'4 6' }));
});

// Group background bands + labels
groups.forEach(g => {
  const lay = groupLayouts[g];
  const gc = GROUP_LABELS[g];
  const bx = 20, bw = COL.asm + NODE_W.asm/2 + 16 - bx;
  svg.appendChild(el('rect', { x:bx,y:lay.y,width:bw,height:lay.h,rx:6,fill:gc.fill+'18',stroke:gc.stroke+'30','stroke-width':'1' }));
  // label bar on left
  svg.appendChild(el('rect', { x:bx,y:lay.y,width:5,height:lay.h,rx:3,fill:gc.stroke+'80' }));
  svg.appendChild(el('text', {
    x: bx+14, y: lay.y + lay.h/2 + 4,
    'font-family':'Segoe UI,sans-serif','font-size':'9','font-weight':'700',
    fill: gc.stroke, 'letter-spacing':'0.12em',
    transform: `rotate(-90,${bx+14},${lay.y+lay.h/2+4})`
  }, gc.label));
});

// Layer 1: edges (drawn below nodes)
const edgeLayer = el('g', { opacity:'1' });

// RM → Component edges
components.forEach(comp => {
  const cp = nodePos[comp.id];
  comp.rms.forEach(rmId => {
    const rp = nodePos[rmId];
    if (!rp || !cp) return;
    const x1 = rp.cx + NODE_W.rm/2;
    const x2 = cp.cx - NODE_W.comp/2;
    edgeLayer.appendChild(bezier(x1, rp.cy, x2, cp.cy, COLORS.rm.stroke, 0.35, 1.2));
  });
});

// Component → Assembly edges
assemblies.forEach(asm => {
  const ap = nodePos[asm.id];
  // deduplicate comp ids (arms/legs share components for L+R)
  const seen = new Set();
  asm.comps.forEach(cid => {
    if (seen.has(cid)) return;
    seen.add(cid);
    const cp = nodePos[cid];
    if (!cp || !ap) return;
    const x1 = cp.cx + NODE_W.comp/2;
    const x2 = ap.cx - NODE_W.asm/2;
    const c = COLORS.comp[asm.group] || COLORS.comp.head;
    edgeLayer.appendChild(bezier(x1, cp.cy, x2, ap.cy, c.stroke, 0.5, 1.5));
  });
});

// Assembly → Product edges
const pp = nodePos['PROD'];
assemblies.forEach(asm => {
  const ap = nodePos[asm.id];
  if (!ap) return;
  const x1 = ap.cx + NODE_W.asm/2;
  const x2 = pp.cx - NODE_W.prod/2;
  edgeLayer.appendChild(bezier(x1, ap.cy, x2, pp.cy, COLORS.prod.stroke, 0.45, 1.8));
});

svg.appendChild(edgeLayer);

// Layer 2: nodes
const nodeLayer = el('g');

// RM nodes
rawMaterials.forEach(rm => {
  const p = nodePos[rm.id];
  if (!p) return;
  nodeLayer.appendChild(rmNode(rm, p));
});

// Component nodes
components.forEach(comp => {
  const p = nodePos[comp.id];
  if (!p) return;
  nodeLayer.appendChild(compNode(comp, p));
});

// Assembly nodes
assemblies.forEach(asm => {
  const p = nodePos[asm.id];
  if (!p) return;
  nodeLayer.appendChild(asmNode(asm, p));
});

// Product node
nodeLayer.appendChild(prodNode(nodePos['PROD']));

svg.appendChild(nodeLayer);
</script>
</body>
</html>
